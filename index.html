<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة دهمان التعليمية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        redbrand: { 500: '#ef4444', 600: '#dc2626', 700: '#b91c1c', 800: '#991b1b', 900: '#7f1d1d' },
                        dark: { bg: '#0a0a0a', card: '#121212', border: '#262626', hover: '#1e1e1e' }
                    },
                    fontFamily: { cairo: ['Cairo', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0a0a0a; color: #f5f5f5; user-select: none; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: #262626; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #dc2626; }
        video::-webkit-media-controls { display: none !important; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between" oncontextmenu="return false;">

    <header class="sticky top-0 z-50 bg-black/90 backdrop-blur-md border-b border-dark-border px-4 lg:px-8 py-4 flex items-center justify-between">
        <div class="cursor-pointer" onclick="showMainPage()">
            <h1 class="font-black text-2xl tracking-wide text-white">منصة دهمان التعليمية</h1>
        </div>
        <button id="backHomeBtn" onclick="showMainPage()" class="hidden flex items-center gap-2 bg-redbrand-600 hover:bg-redbrand-700 text-white px-4 py-2 rounded-xl text-sm font-bold">
            <i class="fa-solid fa-house"></i>
            <span>الرئيسية</span>
        </button>
    </header>

    <main id="mainPage" class="container mx-auto px-4 py-8 flex-1">
        <div class="mb-8 p-6 rounded-2xl bg-gradient-to-r from-redbrand-900/30 via-black to-dark-card border border-redbrand-600/30">
            <span class="inline-block px-3 py-1 bg-redbrand-600/10 border border-redbrand-600/40 text-redbrand-500 rounded-full text-xs font-bold mb-2">
                <i class="fa-solid fa-circle-play ml-1"></i> حصص ومراجعات مسجلة
            </span>
            <h2 class="text-2xl font-black text-white">الدروس التعليمية المتاحة للثانوية العامة</h2>
            <p class="text-neutral-400 text-sm mt-1">اختر الدرس لمشاهدة الحصة الشاملة</p>
        </div>
        <div id="videoGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>

    <main id="playerPage" class="container mx-auto px-4 py-6 flex-1 hidden">
        <div class="max-w-5xl mx-auto">
            <div id="mediaContainer" class="relative bg-black rounded-2xl overflow-hidden shadow-2xl border border-dark-border aspect-video group">
                <video id="hlsVideo" class="w-full h-full object-contain bg-black" playsinline></video>
                <div class="absolute inset-0 bg-gradient-to-t from-black/95 via-transparent to-black/40 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex flex-col justify-between p-4 pointer-events-none">
                    <div class="flex items-center gap-2 pointer-events-auto">
                        <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-neutral-800 border border-neutral-700 text-slate-200 font-bold text-xs">
                            <i class="fa-solid fa-film text-redbrand-500"></i> فيديو مسجل
                        </span>
                        <span id="playerLessonTitle" class="text-white text-sm font-semibold bg-black/60 px-3 py-1 rounded-lg border border-neutral-800"></span>
                    </div>
                    <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                        <button id="centerPlayBtn" class="w-16 h-16 rounded-full bg-redbrand-600/90 text-white flex items-center justify-center text-2xl pointer-events-auto">
                            <i class="fa-solid fa-play"></i>
                        </button>
                    </div>
                    <div class="space-y-3 pointer-events-auto">
                        <div class="flex items-center gap-3 text-xs text-neutral-300">
                            <span id="currentTimeText">00:00</span>
                            <input type="range" id="seekBar" value="0" min="0" max="100" class="w-full h-1.5 bg-neutral-800 rounded-lg appearance-none accent-redbrand-600">
                            <span id="durationText">00:00</span>
                        </div>
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-2 md:gap-4">
                                <button id="playPauseBtn" class="text-white text-lg p-1"><i class="fa-solid fa-play"></i></button>
                                <button onclick="rewind(10)" class="text-neutral-300 text-xs bg-neutral-900/90 px-2.5 py-1.5 rounded-lg border border-neutral-800"><i class="fa-solid fa-rotate-left"></i> 10ث</button>
                                <button onclick="forward(10)" class="text-neutral-300 text-xs bg-neutral-900/90 px-2.5 py-1.5 rounded-lg border border-neutral-800">10ث <i class="fa-solid fa-rotate-right"></i></button>
                                <div class="flex items-center gap-1.5">
                                    <button id="muteBtn" class="text-neutral-300 p-1"><i class="fa-solid fa-volume-high"></i></button>
                                    <input type="range" id="volumeBar" min="0" max="1" step="0.1" value="1" class="w-16 h-1 bg-neutral-800 rounded appearance-none accent-redbrand-600 hidden md:block">
                                </div>
                            </div>
                            <div class="flex items-center gap-3">
                                <select id="speedSelect" onchange="changeSpeed(this.value)" class="bg-neutral-900 border border-neutral-800 text-neutral-200 text-xs rounded-lg px-2 py-1">
                                    <option value="0.5">0.5x</option>
                                    <option value="0.75">0.75x</option>
                                    <option value="1" selected>1.0x</option>
                                    <option value="1.25">1.25x</option>
                                    <option value="1.5">1.5x</option>
                                    <option value="2">2.0x</option>
                                </select>
                                <button onclick="toggleFullscreen()" class="text-neutral-300 p-1"><i class="fa-solid fa-expand"></i></button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="mt-6 bg-dark-card border border-dark-border rounded-2xl p-6">
                <h2 id="activeLessonTitle" class="text-xl font-bold text-white mb-2"></h2>
                <div class="flex items-center gap-4 text-xs text-neutral-400">
                    <span class="flex items-center gap-1"><i class="fa-regular fa-eye text-redbrand-500"></i> <span id="viewsCounterText">0</span> مشاهدة</span>
                </div>
                <div class="mt-6 flex items-center gap-4">
                    <img id="teacherAvatar" src="" class="w-14 h-14 rounded-full object-cover border-2 border-redbrand-600">
                    <div>
                        <h3 id="teacherName" class="font-bold text-white"></h3>
                        <a id="teacherPlatformLink" href="#" target="_blank" class="text-xs text-redbrand-500 hover:underline">
                            <i class="fa-solid fa-globe text-[10px]"></i> زيارة منصة المدرس
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-black border-t border-dark-border py-4 text-center text-xs text-neutral-500 mt-8">
        منصة دهمان التعليمية © 2026
    </footer>

    <script>
        const lessonsData = [
            {
                id: 'beshbeshy-haia',
                title: 'تدريبات على البلاغة',
                grade: 'الصف الثالث الثانوي',
                subject: 'اللغة العربية',
                teacher: 'مستر أحمد بشبيشي',
                teacherAvatar: 'https://images.unsplash.com/photo-1456513080510-7bf3a84b82f8?auto=format&fit=crop&q=80&w=200',
                thumbnail: 'https://images.unsplash.com/photo-1456513080510-7bf3a84b82f8?auto=format&fit=crop&q=80&w=800',
                platformUrl: 'https://ahmedelbeshbeshy.com',
                streamUrl: '/proxy/beshbeshy-haia/playlist.m3u8'
            },
            {
                id: 'sha3t-dars2',
                title: 'حل الدرس التاني مقومات',
                grade: 'الصف الثالث الثانوي',
                subject: 'الجغرافيا والتأسيس',
                teacher: 'مستر محمد شعت',
                teacherAvatar: 'https://images.unsplash.com/photo-1524995997946-a1c2e315a42f?auto=format&fit=crop&q=80&w=200',
                thumbnail: 'https://images.unsplash.com/photo-1524995997946-a1c2e315a42f?auto=format&fit=crop&q=80&w=800',
                platformUrl: 'https://sha3t.ta3allm.com',
                streamUrl: '/proxy/sha3t-dars2/playlist.m3u8'
            },
            {
                id: 'misshanaa-foundation',
                title: 'كورس تأسيس لغة إنجليزية 3ث',
                grade: 'الصف الثالث الثانوي',
                subject: 'اللغة الإنجليزية',
                teacher: 'مس هناء عوض',
                teacherAvatar: 'https://images.unsplash.com/photo-1503676260728-1c00da094a0b?auto=format&fit=crop&q=80&w=200',
                thumbnail: 'https://images.unsplash.com/photo-1503676260728-1c00da094a0b?auto=format&fit=crop&q=80&w=800',
                platformUrl: 'https://www.misshanaa.com',
                streamUrl: '/proxy/misshanaa-foundation/playlist.m3u8'
            },
            {
                id: 'hodeab-faragya',
                title: 'مراجعة هندسة فراغية',
                grade: 'الصف الثالث الثانوي',
                subject: 'الرياضيات والمهندسين',
                teacher: 'مستر أحمد هديب',
                teacherAvatar: 'https://images.unsplash.com/photo-1635070041078-e363dbe005cb?auto=format&fit=crop&q=80&w=200',
                thumbnail: 'https://images.unsplash.com/photo-1635070041078-e363dbe005cb?auto=format&fit=crop&q=80&w=800',
                platformUrl: 'https://ahmedhodeab.com/',
                streamUrl: '/proxy/hodeab-faragya/playlist.m3u8'
            }
        ];

        let currentHls = null;
        let activeLesson = null;
        const videoElem = document.getElementById('hlsVideo');

        function renderVideoGrid() {
            const grid = document.getElementById('videoGrid');
            grid.innerHTML = '';
            lessonsData.forEach(lesson => {
                const views = parseInt(localStorage.getItem(`views_${lesson.id}`) || '0');
                const card = document.createElement('div');
                card.className = 'bg-dark-card border border-dark-border rounded-2xl overflow-hidden hover:border-redbrand-600/60 transition-all hover:-translate-y-1 shadow-lg';
                card.innerHTML = `
                    <div class="relative aspect-video bg-neutral-900 cursor-pointer overflow-hidden group" onclick="openPlayer('${lesson.id}')">
                        <img src="${lesson.thumbnail}" class="w-full h-full object-cover group-hover:scale-105 transition-transform" alt="">
                        <div class="absolute inset-0 bg-black/50 group-hover:bg-black/30 flex items-center justify-center">
                            <div class="w-12 h-12 rounded-full bg-redbrand-600/90 text-white flex items-center justify-center text-lg">
                                <i class="fa-solid fa-play"></i>
                            </div>
                        </div>
                        <span class="absolute top-3 right-3 px-2.5 py-1 bg-black/80 rounded-md text-[10px] text-redbrand-500 font-bold border border-redbrand-600/30">${lesson.subject}</span>
                    </div>
                    <div class="p-5">
                        <h3 class="font-bold text-white text-base mb-2 cursor-pointer hover:text-redbrand-500" onclick="openPlayer('${lesson.id}')">${lesson.title}</h3>
                        <div class="flex items-center gap-3 my-3">
                            <img src="${lesson.teacherAvatar}" class="w-9 h-9 rounded-full object-cover border border-redbrand-600/40" alt="">
                            <div>
                                <h4 class="text-xs font-semibold text-neutral-200">${lesson.teacher}</h4>
                                <span class="text-[10px] text-neutral-400">${lesson.grade}</span>
                            </div>
                        </div>
                    </div>
                    <div class="px-5 pb-5 pt-2 border-t border-dark-border/60 flex items-center justify-between">
                        <span class="text-xs text-neutral-400"><i class="fa-regular fa-eye text-redbrand-500"></i> ${views} مشاهدة</span>
                        <button onclick="openPlayer('${lesson.id}')" class="bg-redbrand-600 hover:bg-redbrand-700 text-white px-4 py-2 rounded-xl text-xs font-bold">
                            <i class="fa-solid fa-circle-play"></i> مشاهدة الآن
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function openPlayer(lessonId) {
            activeLesson = lessonsData.find(l => l.id === lessonId);
            if (!activeLesson) return;

            const viewsKey = `views_${activeLesson.id}`;
            const viewedKey = `has_viewed_${activeLesson.id}`;
            let views = parseInt(localStorage.getItem(viewsKey) || '0');
            if (!localStorage.getItem(viewedKey)) {
                views += 1;
                localStorage.setItem(viewsKey, views);
                localStorage.setItem(viewedKey, 'true');
            }

            document.getElementById('playerLessonTitle').textContent = activeLesson.title;
            document.getElementById('activeLessonTitle').textContent = activeLesson.title;
            document.getElementById('teacherName').textContent = activeLesson.teacher;
            document.getElementById('teacherAvatar').src = activeLesson.teacherAvatar;
            document.getElementById('teacherPlatformLink').href = activeLesson.platformUrl;
            document.getElementById('viewsCounterText').textContent = views;

            document.getElementById('mainPage').classList.add('hidden');
            document.getElementById('playerPage').classList.remove('hidden');
            document.getElementById('backHomeBtn').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
            initHlsStream(activeLesson.streamUrl);
        }

        function initHlsStream(url) {
            if (currentHls) { currentHls.destroy(); currentHls = null; }
            videoElem.removeAttribute('src');
            videoElem.load();

            if (Hls.isSupported()) {
                currentHls = new Hls({ enableWorker: true });
                currentHls.loadSource(url);
                currentHls.attachMedia(videoElem);
                currentHls.on(Hls.Events.MANIFEST_PARSED, () => {
                    videoElem.play().catch(() => {});
                    updatePlayPauseUI();
                });
                currentHls.on(Hls.Events.ERROR, (e, data) => {
                    if (data.fatal) {
                        if (data.type === Hls.ErrorTypes.NETWORK_ERROR) currentHls.startLoad();
                        else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) currentHls.recoverMediaError();
                        else currentHls.destroy();
                    }
                });
            } else if (videoElem.canPlayType('application/vnd.apple.mpegurl')) {
                videoElem.src = url;
                videoElem.play().catch(() => {});
            }
        }

        function showMainPage() {
            if (videoElem) videoElem.pause();
            if (currentHls) { currentHls.destroy(); currentHls = null; }
            document.getElementById('playerPage').classList.add('hidden');
            document.getElementById('backHomeBtn').classList.add('hidden');
            document.getElementById('mainPage').classList.remove('hidden');
            renderVideoGrid();
        }

        const playPauseBtn = document.getElementById('playPauseBtn');
        const centerPlayBtn = document.getElementById('centerPlayBtn');
        const seekBar = document.getElementById('seekBar');
        const currentTimeText = document.getElementById('currentTimeText');
        const durationText = document.getElementById('durationText');
        const muteBtn = document.getElementById('muteBtn');
        const volumeBar = document.getElementById('volumeBar');

        function togglePlay() {
            if (videoElem.paused) videoElem.play();
            else videoElem.pause();
            updatePlayPauseUI();
        }

        function updatePlayPauseUI() {
            const icon = videoElem.paused ? 'fa-play' : 'fa-pause';
            playPauseBtn.innerHTML = `<i class="fa-solid ${icon}"></i>`;
            centerPlayBtn.innerHTML = `<i class="fa-solid ${icon}"></i>`;
            centerPlayBtn.parentElement.classList.toggle('hidden', !videoElem.paused);
        }

        playPauseBtn.addEventListener('click', togglePlay);
        centerPlayBtn.addEventListener('click', togglePlay);

        function forward(s) { videoElem.currentTime = Math.min(videoElem.currentTime + s, videoElem.duration); }
        function rewind(s) { videoElem.currentTime = Math.max(videoElem.currentTime - s, 0); }
        function changeSpeed(s) { videoElem.playbackRate = parseFloat(s); }

        videoElem.addEventListener('timeupdate', () => {
            if (!isNaN(videoElem.duration)) {
                seekBar.value = (videoElem.currentTime / videoElem.duration) * 100;
                currentTimeText.textContent = formatTime(videoElem.currentTime);
                durationText.textContent = formatTime(videoElem.duration);
            }
        });

        seekBar.addEventListener('input', () => {
            if (!isNaN(videoElem.duration)) videoElem.currentTime = (seekBar.value / 100) * videoElem.duration;
        });

        muteBtn.addEventListener('click', () => {
            videoElem.muted = !videoElem.muted;
            muteBtn.innerHTML = videoElem.muted ? '<i class="fa-solid fa-volume-xmark text-redbrand-500"></i>' : '<i class="fa-solid fa-volume-high"></i>';
        });

        volumeBar.addEventListener('input', (e) => {
            videoElem.volume = e.target.value;
            videoElem.muted = e.target.value == 0;
        });

        function toggleFullscreen() {
            const c = document.getElementById('mediaContainer');
            if (!document.fullscreenElement) c.requestFullscreen();
            else document.exitFullscreen();
        }

        function formatTime(s) {
            const m = Math.floor(s / 60), sec = Math.floor(s % 60);
            return `${m < 10 ? '0' : ''}${m}:${sec < 10 ? '0' : ''}${sec}`;
        }

        window.addEventListener('DOMContentLoaded', renderVideoGrid);
    </script>
</body>
</html>
